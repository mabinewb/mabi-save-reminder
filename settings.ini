# 수정한 뒤 트레이 메뉴에서 '설정 다시 읽기'를 누르세요.
# 실행 파일 이름 여러 개는 쉼표로 구분. 런처보다 실제 게임 Client.exe 권장.
process_names=Client.exe
# Client.exe라는 다른 프로그램과 구별하기 위한 실행 경로 일부.
# 설치 경로에 mabinogi가 없다면 실제 폴더 이름으로 바꾸세요. 빈 값이면 경로 검사 생략.
path_contains=mabinogi
# 색상 교체 간격(밀리초). 0이면 깜빡이지 않음. 최소 500.
blink_ms=650
# 자동으로 닫힐 때까지의 초. 기본값 5분.
timeout_seconds=300
